<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIV System - Professional Version</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 1400px; margin: auto; background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
    .login-container { max-width: 450px; margin: 100px auto; background: #fff; border-radius: 20px; padding: 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #fff; padding: 30px; display: flex; justify-content: space-between; align-items: center; }
    .content { padding: 30px; }
    .page { display: none; }
    .page.active { display: block; }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; margin: 2px; }
    .btn-primary { background: #2a5298; color: #fff; }
    .btn-success { background: #28a745; color: #fff; }
    .btn-danger { background: #dc3545; color: #fff; }
    .btn-warning { background: #ffc107; color: #333; }
    input, select { padding: 10px; margin: 5px 0; width: 100%; border-radius: 6px; border: 1px solid #ddd; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
    th, td { padding: 10px; border: 1px solid #dee2e6; text-align: center; font-size: 13px; }
    thead { background: #2a5298; color: white; }
    .filter-input { width: 90%; padding: 4px; font-size: 11px; margin-top: 5px; }
    .project-card { border: 1px solid #ddd; border-radius: 10px; padding: 20px; cursor: pointer; background: #f9f9f9; text-align: center; transition: 0.3s; }
    .project-card:hover { border-color: #2a5298; transform: translateY(-3px); }
    .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
    .modal-content { background: white; margin: 5% auto; padding: 25px; border-radius: 15px; width: 80%; max-width: 800px; max-height: 80vh; overflow-y: auto; position: relative; cursor: move; }
    .modal-header { cursor: move; padding: 10px; background: #2a5298; color: white; margin: -25px -25px 15px -25px; border-radius: 15px 15px 0 0; display: flex; justify-content: space-between; align-items: center; }
    .modal-close { cursor: pointer; font-size: 24px; font-weight: bold; color: white; background: none; border: none; }
    .modal-body { max-height: 50vh; overflow-y: auto; }
    .uom-alert { border: 2px solid #dc3545 !important; background: #fff5f5; }
    .role-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-left: 8px; }
    .role-admin { background: #dc3545; color: white; }
    .role-user { background: #28a745; color: white; }
</style>
</head>
<body>

<script>
let users = [], projects = [], currentUser = null, selectedProject = null;
let masterInventory = [], mivTemplate = null, issuedMIVs = [];
let modalDrag = { active: false, currentX: 0, currentY: 0, initialX: 0, initialY: 0, xOffset: 0, yOffset: 0 };

window.onload = () => {
    users = localStorage.miv_users ? JSON.parse(localStorage.miv_users) : [{username: 'admin', password: 'admin123', role: 'admin'}];
    projects = localStorage.miv_projects ? JSON.parse(localStorage.miv_projects) : [];
    issuedMIVs = localStorage.miv_issued ? JSON.parse(localStorage.miv_issued) : [];
    masterInventory = localStorage.miv_inventory ? JSON.parse(localStorage.miv_inventory) : [];
    
    if (localStorage.miv_template) {
        try {
            mivTemplate = JSON.parse(localStorage.miv_template);
        } catch (e) {
            mivTemplate = null;
        }
    }
    
    initModalDrag();
};

function loginUser() {
    let u = document.getElementById('loginUsername').value;
    let p = document.getElementById('loginPassword').value;
    
    document.getElementById('loginError').style.display = 'none';
    
    if (!u || !p) {
        document.getElementById('loginError').textContent = '❌ Please enter username and password';
        document.getElementById('loginError').style.display = 'block';
        return;
    }
    
    let user = users.find(x => x.username === u && x.password === p);
    
    if (!user) { 
        document.getElementById('loginError').textContent = '❌ Wrong username or password';
        document.getElementById('loginError').style.display = 'block';
        return; 
    }
    
    currentUser = user;
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('mainSystem').style.display = 'block';
    document.getElementById('currentUserName').innerHTML = currentUser.username + 
        `<span class="role-badge role-${currentUser.role}">${currentUser.role.toUpperCase()}</span>`;
    
    if (user.role === 'admin') {
        showAdmin();
    } else {
        showUser();
    }
}

function showAdmin() {
    document.getElementById('adminPage').classList.add('active');
    renderProjects(); 
    renderUsers(); 
    renderIssuedMIVs();
    updateUploadStatus();
}

function updateUploadStatus() {
    if (masterInventory.length > 0) {
        document.getElementById('sapStatus').innerHTML = `✓ ${masterInventory.length} items loaded`;
        document.getElementById('sapStatus').style.color = '#28a745';
    } else {
        document.getElementById('sapStatus').innerHTML = '⚠ No data uploaded';
        document.getElementById('sapStatus').style.color = '#dc3545';
    }
    
    if (mivTemplate) {
        document.getElementById('templateStatus').innerHTML = '✓ Template loaded';
        document.getElementById('templateStatus').style.color = '#28a745';
    } else {
        document.getElementById('templateStatus').innerHTML = '⚠ No template uploaded';
        document.getElementById('templateStatus').style.color = '#dc3545';
    }
}

function addProject() {
    let no = document.getElementById('projNo').value;
    let name = document.getElementById('projName').value;
    let loc = document.getElementById('projLoc').value;
    
    if (!no || !name) {
        alert('Please enter project number and name');
        return;
    }
    
    projects.push({projectNo: no, projectName: name, location: loc});
    document.getElementById('projNo').value = '';
    document.getElementById('projName').value = '';
    document.getElementById('projLoc').value = '';
    saveAndRefresh('projects');
}

function deleteProject(i) { 
    if(confirm("Delete Project?")) { 
        projects.splice(i, 1); 
        saveAndRefresh('projects'); 
    } 
}

function editProject(i) {
    let project = projects[i];
    let newName = prompt("Edit Project Name:", project.projectName);
    if (newName === null) return;
    
    let newLocation = prompt("Edit Project Location:", project.location || '');
    if (newLocation === null) return;
    
    if (newName.trim()) {
        projects[i].projectName = newName.trim();
    }
    projects[i].location = newLocation.trim();
    
    saveAndRefresh('projects');
    alert('Project updated successfully!');
}

function addUser() {
    let username = document.getElementById('username').value;
    let password = document.getElementById('userPassword').value;
    let role = document.getElementById('userRole').value;
    let selectedProjects = [...document.getElementById('projectAssign').selectedOptions].map(o => o.value);
    
    if (!username) { alert('Please enter a username'); return; }
    if (!password) { alert('Please enter a password'); return; }
    if (users.find(u => u.username === username)) { alert('Username already exists'); return; }
    
    users.push({username: username, password: password, role: role, projects: selectedProjects});
    document.getElementById('username').value = '';
    document.getElementById('userPassword').value = '';
    document.getElementById('userRole').value = 'user';
    saveAndRefresh('users');
}

function deleteUser(i) { 
    let allUsers = users.filter(x => x.role === 'user' || x.role === 'admin');
    let targetUser = allUsers[i];
    
    if (targetUser.username === 'admin') { 
        alert('Cannot delete default admin user'); 
        return; 
    }
    
    if (!confirm(`Delete user "${targetUser.username}"?`)) return;
    
    let uIdx = users.findIndex(u => u.username === targetUser.username);
    users.splice(uIdx, 1); 
    saveAndRefresh('users'); 
}

function editUserFunc(index) {
    let allUsers = users.filter(x => x.role === 'user' || x.role === 'admin');
    let user = allUsers[index];
    
    if (!user) {
        alert('User not found!');
        return;
    }
    
    if (user.username === 'admin') { 
        alert('Cannot modify default admin user'); 
        return; 
    }
    
    // Step 1: Change Password
    let newPassword = prompt(`Edit User: ${user.username}\n\n═══ Step 1/3: Change Password ═══\n\nEnter new password:\n(Leave empty to keep current password)`);
    
    if (newPassword === null) return; // User clicked Cancel
    
    // Step 2: Change Related Projects
    let currentProjects = user.projects && user.projects.length > 0 ? user.projects.join(', ') : 'None';
    let availableProjects = projects.length > 0 ? projects.map(p => p.projectNo).join(', ') : 'No projects available';
    let newProjectsStr = prompt(
        `═══ Step 2/3: Change Projects ═══\n\nAvailable: ${availableProjects}\nCurrent: ${currentProjects}\n\nEnter project numbers separated by commas:\n(e.g., P001, P002)\nLeave empty to remove all projects`,
        currentProjects !== 'None' ? currentProjects : ''
    );
    
    if (newProjectsStr === null) return; // User clicked Cancel
    
    // Step 3: Change Role
    let newRole = prompt(
        `═══ Step 3/3: Change Role ═══\n\nCurrent: ${user.role.toUpperCase()}\n\nEnter new role:\n• Type "admin" for Admin\n• Type "user" for User`,
        user.role
    );
    
    if (!newRole) return; // User clicked Cancel
    
    if (newRole !== 'admin' && newRole !== 'user') {
        alert('❌ Invalid role!\n\nMust be "admin" or "user".\nChanges cancelled.');
        return;
    }
    
    // Apply all changes
    let uIdx = users.findIndex(u => u.username === user.username);
    
    // Update password
    if (newPassword && newPassword.trim() !== '') {
        users[uIdx].password = newPassword.trim();
    }
    
    // Update projects
    if (newProjectsStr.trim() === '') {
        users[uIdx].projects = [];
    } else {
        users[uIdx].projects = newProjectsStr.split(',').map(p => p.trim()).filter(p => p);
    }
    
    // Update role
    users[uIdx].role = newRole;
    
    saveAndRefresh('users');
    
    alert(`✅ User Updated Successfully!\n\n` +
          `Username: ${user.username}\n` +
          `Password: ${newPassword && newPassword.trim() ? '✓ Changed' : '○ Unchanged'}\n` +
          `Projects: ${users[uIdx].projects.length > 0 ? users[uIdx].projects.join(', ') : 'None'}\n` +
          `Role: ${newRole.toUpperCase()}`);
}

function saveAndRefresh(type) {
    if(type==='projects') { 
        localStorage.miv_projects = JSON.stringify(projects); 
        renderProjects(); 
    }
    if(type==='users') { 
        localStorage.miv_users = JSON.stringify(users); 
        renderUsers(); 
    }
    if(type==='history') { 
        localStorage.miv_issued = JSON.stringify(issuedMIVs); 
        renderIssuedMIVs(); 
    }
}

function renderProjects() {
    let html = '';
    projects.forEach((p, i) => {
        html += `<tr>
            <td>${p.projectNo}</td>
            <td>${p.projectName}</td>
            <td>
                <button class="btn btn-warning" onclick="editProject(${i})">Edit</button>
                <button class="btn btn-danger" onclick="deleteProject(${i})">Del</button>
            </td>
        </tr>`;
    });
    document.getElementById('projectTable').innerHTML = html;
    
    // Update project assignment dropdown
    let options = '';
    projects.forEach(p => {
        options += `<option value="${p.projectNo}">${p.projectNo}</option>`;
    });
    document.getElementById('projectAssign').innerHTML = options;
}

function renderUsers() {
    let allUsers = users.filter(u => u.role === 'user' || u.role === 'admin');
    let html = '';
    
    allUsers.forEach((u, i) => {
        html += `<tr>
            <td>${u.username}</td>
            <td><span class="role-badge role-${u.role}">${u.role.toUpperCase()}</span></td>
            <td>${u.projects && u.projects.length > 0 ? u.projects.join(', ') : 'None'}</td>
            <td>
                <button class="btn btn-warning" onclick="editUserFunc(${i})">Edit</button>
                <button class="btn btn-danger" onclick="deleteUser(${i})">Delete</button>
            </td>
        </tr>`;
    });
    
    document.getElementById('userTable').innerHTML = html;
}

function renderIssuedMIVs() {
    let html = '';
    issuedMIVs.forEach((miv, i) => {
        html += `<tr>
            <td>${miv.username}</td>
            <td>${miv.projectNo}</td>
            <td>${miv.date}</td>
            <td>
                <button class="btn btn-success" onclick="adminExport(${i})">Export</button>
                <button class="btn btn-danger" onclick="deleteHistory(${i})">Del</button>
            </td>
        </tr>`;
    });
    document.getElementById('mivHistoryTable').innerHTML = html;
}

function deleteHistory(i) { 
    if(confirm("Delete History?")) { 
        issuedMIVs.splice(i,1); 
        saveAndRefresh('history'); 
    } 
}

function showUser() {
    document.getElementById('userPage').classList.add('active');
    let up = projects.filter(p => currentUser.projects.includes(p.projectNo));
    let html = '';
    up.forEach(p => {
        html += `<div class="project-card" onclick="loadMivTable('${p.projectNo}')">
            <h4>${p.projectName}</h4>
            <p>${p.projectNo}</p>
        </div>`;
    });
    document.getElementById('projectCards').innerHTML = html;
}

function loadMivTable(pNo) {
    selectedProject = projects.find(p => p.projectNo === pNo);
    document.getElementById('projectSelection').style.display = 'none';
    document.getElementById('userTableSection').style.display = 'block';
    renderUserMivTable(masterInventory.filter(item => item.bin.toString().startsWith(pNo)));
}

function validateUomField(qtyInput) {
    let row = qtyInput.closest('tr');
    let uomInput = row.querySelector('.iuom');
    if (qtyInput.value > 0 && uomInput.value.trim() === "") {
        uomInput.classList.add('uom-alert');
    } else {
        uomInput.classList.remove('uom-alert');
    }
}

function renderUserMivTable(data) {
    let html = `<thead>
        <tr>
            <th style="width: 50px;">No<br><input class="filter-input" onkeyup="filterUserTable(0, this.value)"></th>
            <th style="width: 250px;">Description<br><input class="filter-input" onkeyup="filterUserTable(1, this.value)"></th>
            <th style="width: 100px;">Code<br><input class="filter-input" onkeyup="filterUserTable(2, this.value)"></th>
            <th style="width: 80px;">SAP Qty<br><input class="filter-input" onkeyup="filterUserTable(3, this.value)"></th>
            <th style="width: 120px;">Issue Qty</th>
            <th style="width: 120px;">UoM</th>
            <th style="width: 200px;">Notes</th>
        </tr>
    </thead><tbody id="mivBody">`;
    data.forEach((r, i) => {
        html += `<tr><td>${i+1}</td><td>${r.desc}</td><td>${r.code}</td><td>${r.sapQty}</td>
        <td><input type="number" class="iqty" oninput="validateUomField(this)" style="width: 100%;"></td>
        <td><input type="text" class="iuom" oninput="validateUomField(this.closest('tr').querySelector('.iqty'))" placeholder="Required if Qty entered" style="width: 100%;"></td>
        <td><input type="text" class="inote" style="width: 100%;"></td></tr>`;
    });
    document.getElementById('userMivTable').innerHTML = html + `</tbody>`;
    window.activeData = data;
}

function filterUserTable(col, val) {
    let rows = document.getElementById('mivBody').rows;
    for (let r of rows) {
        r.style.display = r.cells[col].innerText.toLowerCase().includes(val.toLowerCase()) ? "" : "none";
    }
}

function reviewMIV() {
    let rows = document.querySelectorAll('#mivBody tr');
    let items = [], error = false;
    rows.forEach((row, i) => {
        let q = row.querySelector('.iqty').value, u = row.querySelector('.iuom').value;
        if (q > 0) {
            if (!u.trim()) { error = true; row.querySelector('.iuom').classList.add('uom-alert'); }
            items.push({
                desc: window.activeData[i].desc,
                qty: q,
                uom: u,
                note: row.querySelector('.inote').value,
                projectNo: selectedProject.projectNo,
                code: window.activeData[i].code,
                sapQty: window.activeData[i].sapQty,
                bin: window.activeData[i].bin
            });
        }
    });
    if(error) return alert("UoM is required for all entered quantities!");
    if(items.length === 0) return alert("No quantities entered.");
    window.reviewItems = items;
    document.getElementById('reviewContent').innerHTML = `<table><thead><tr><th>Desc</th><th>Qty</th><th>UoM</th><th>Notes</th><th>Project No</th></tr></thead><tbody>` + 
        items.map(it => `<tr><td>${it.desc}</td><td>${it.qty}</td><td>${it.uom}</td><td>${it.note || '-'}</td><td>${it.projectNo}</td></tr>`).join('') + `</tbody></table>`;
    document.getElementById('confirmModal').style.display = 'block';
}

function finalSubmit() {
    issuedMIVs.push({ username: currentUser.username, projectNo: selectedProject.projectNo, date: new Date().toLocaleString(), items: window.reviewItems, filename: `MIV_${selectedProject.projectNo}.xlsx` });
    localStorage.miv_issued = JSON.stringify(issuedMIVs);
    location.reload();
}

function adminExport(idx) {
    try {
        let miv = issuedMIVs[idx];
        let items = miv.items;
        
        if (!mivTemplate) {
            alert('Please upload MIV template first!');
            return;
        }
        
        let ws = JSON.parse(JSON.stringify(mivTemplate.Sheets[mivTemplate.SheetNames[0]]));
        
        if (!ws['!merges']) ws['!merges'] = [];

        const borderStyle = {
            top: {style: "thin", color: {rgb: "000000"}},
            bottom: {style: "thin", color: {rgb: "000000"}},
            left: {style: "thin", color: {rgb: "000000"}},
            right: {style: "thin", color: {rgb: "000000"}}
        };

        const centerAlign = {
            vertical: "center",
            horizontal: "center"
        };

        let hasMergeA1H4 = ws['!merges'].some(m => 
            m.s.r === 0 && m.s.c === 0 && m.e.r === 3 && m.e.c === 7
        );
        if (!hasMergeA1H4) {
            ws['!merges'].push({s: {r: 0, c: 0}, e: {r: 3, c: 7}});
        }

        for (let r = 0; r <= 10; r++) {
            for (let c = 0; c <= 7; c++) {
                let ref = XLSX.utils.encode_cell({r: r, c: c});
                if (!ws[ref]) ws[ref] = {v: '', t: 's', s: {}};
                if (!ws[ref].s) ws[ref].s = {};
                ws[ref].s.border = borderStyle;
                if (!ws[ref].s.alignment) ws[ref].s.alignment = centerAlign;
            }
        }

        let b2Ref = 'B2';
        if (!ws[b2Ref]) ws[b2Ref] = {t: 's', s: {}};
        ws[b2Ref].v = 'Project';
        ws[b2Ref].s.border = borderStyle;
        ws[b2Ref].s.alignment = centerAlign;

        let g10LabelRef = 'G10';
        if (!ws[g10LabelRef]) ws[g10LabelRef] = {t: 's', s: {}};
        ws[g10LabelRef].v = 'Date';
        ws[g10LabelRef].s.border = borderStyle;
        ws[g10LabelRef].s.alignment = centerAlign;

        let projectInfo = projects.find(p => p.projectNo === miv.projectNo);
        
        let d10Ref = XLSX.utils.encode_cell({r: 9, c: 3});
        ws[d10Ref] = { v: miv.projectNo, t: 's', s: { border: borderStyle, alignment: centerAlign }};

        let g10Ref = XLSX.utils.encode_cell({r: 9, c: 6});
        ws[g10Ref] = { v: miv.date || new Date().toLocaleDateString(), t: 's', s: { border: borderStyle, alignment: centerAlign }};

        let b10Ref = XLSX.utils.encode_cell({r: 9, c: 1});
        ws[b10Ref] = { v: miv.projectNo, t: 's', s: { border: borderStyle, alignment: centerAlign }};

        if (projectInfo && projectInfo.location) {
            let e10Ref = XLSX.utils.encode_cell({r: 9, c: 4});
            ws[e10Ref] = { v: projectInfo.location, t: 's', s: { border: borderStyle, alignment: centerAlign }};
        }

        let h10Ref = XLSX.utils.encode_cell({r: 9, c: 7});
        if (!ws[h10Ref]) {
            ws[h10Ref] = { v: '', t: 's', s: { border: borderStyle, alignment: centerAlign }};
        }

        let row13Format = {};
        for (let c = 0; c <= 7; c++) {
            let cellRef = XLSX.utils.encode_cell({r: 12, c: c});
            if (ws[cellRef] && ws[cellRef].s) {
                row13Format[c] = JSON.parse(JSON.stringify(ws[cellRef].s));
            } else {
                row13Format[c] = { border: borderStyle, alignment: centerAlign };
            }
        }

        let footerRows = [];
        for (let r = 19; r <= 22; r++) {
            let rowData = {};
            for (let c = 0; c <= 7; c++) {
                let ref = XLSX.utils.encode_cell({r: r, c: c});
                if (ws[ref]) rowData[c] = JSON.parse(JSON.stringify(ws[ref]));
            }
            footerRows.push(rowData);
        }

        let footerMerges = ws['!merges'].filter(m => m.s.r >= 19 && m.s.r <= 22);

        const dataStartRow = 12;
        items.forEach((it, i) => {
            let r = dataStartRow + i;
            const setCell = (c, val) => {
                let ref = XLSX.utils.encode_cell({r: r, c: c});
                ws[ref] = {
                    v: val,
                    t: (typeof val === 'number' ? 'n' : 's'),
                    s: JSON.parse(JSON.stringify(row13Format[c] || {border: borderStyle, alignment: centerAlign}))
                };
            };
            
            setCell(0, i + 1);
            setCell(1, it.desc);
            setCell(2, it.code);
            setCell(3, Number(it.qty));
            setCell(4, it.uom);
            setCell(5, it.note || '');
            setCell(6, '');
            setCell(7, '');
        });

        let lastDataRow = dataStartRow + items.length - 1;
        let footerStartRow = lastDataRow + 1;

        footerRows.forEach((rowData, i) => {
            let targetRow = footerStartRow + i;
            for (let c = 0; c <= 7; c++) {
                let ref = XLSX.utils.encode_cell({r: targetRow, c: c});
                if (rowData[c]) {
                    ws[ref] = JSON.parse(JSON.stringify(rowData[c]));
                } else {
                    ws[ref] = { v: '', t: 's', s: {border: borderStyle, alignment: centerAlign}};
                }
            }
        });

        ws['!merges'] = ws['!merges'].filter(m => m.s.r < 19 || m.s.r > 22);
        footerMerges.forEach(merge => {
            let offset = footerStartRow - 19;
            ws['!merges'].push({
                s: {r: merge.s.r + offset, c: merge.s.c},
                e: {r: merge.e.r + offset, c: merge.e.c}
            });
        });

        for (let i = 0; i < 4; i++) {
            let targetRow = footerStartRow + i;
            for (let c = 0; c <= 7; c++) {
                let ref = XLSX.utils.encode_cell({r: targetRow, c: c});
                if (!ws[ref]) ws[ref] = {v: '', t: 's', s: {}};
                if (!ws[ref].s) ws[ref].s = {};
                ws[ref].s.border = borderStyle;
                if (!ws[ref].s.alignment) ws[ref].s.alignment = centerAlign;
            }
        }

        let finalRow = footerStartRow + 3;

        for (let r = 11; r <= lastDataRow; r++) {
            for (let c = 0; c <= 7; c++) {
                let ref = XLSX.utils.encode_cell({r: r, c: c});
                if (!ws[ref]) ws[ref] = {v: '', t: 's', s: {}};
                if (!ws[ref].s) ws[ref].s = {};
                ws[ref].s.border = borderStyle;
                if (!ws[ref].s.alignment) ws[ref].s.alignment = centerAlign;
            }
        }

        ws['!ref'] = XLSX.utils.encode_range({s: {r: 0, c: 0}, e: {r: finalRow, c: 7}});

        let dateObj = miv.date ? new Date(miv.date) : new Date();
        let day = String(dateObj.getDate()).padStart(2, '0');
        let month = String(dateObj.getMonth() + 1).padStart(2, '0');
        let year = dateObj.getFullYear();
        let formattedDate = `${day}-${month}-${year}`;
        let filename = `${miv.projectNo}_${formattedDate}.xlsx`;

        let wb = {SheetNames: ["MIV"], Sheets: {MIV: ws}};
        XLSX.writeFile(wb, filename);
        
        alert('Excel file exported successfully!');
    } catch (error) {
        console.error('Export error:', error);
        alert('Export failed: ' + error.message);
    }
}

function handleSAPImport(e) {
    let r = new FileReader();
    r.onload = x => {
        let wb = XLSX.read(new Uint8Array(x.target.result), {type: 'array'});
        let data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
        let h = data[0].map(v => v.toString().toLowerCase().trim());
        let idx = { bin: h.indexOf("bin location"), itemno: h.indexOf("item no."), desc: h.indexOf("item description"), qty: h.indexOf("item qty"), uom: h.indexOf("unit of measurement") };
        masterInventory = data.slice(1).map(row => ({ bin: row[idx.bin] || "", code: row[idx.itemno] || "", desc: row[idx.desc] || "", sapQty: row[idx.qty] || 0, uom: row[idx.uom] || "" }));
        
        localStorage.miv_inventory = JSON.stringify(masterInventory);
        updateUploadStatus();
        alert('SAP Data Imported Successfully!');
    };
    r.readAsArrayBuffer(e.target.files[0]);
}

function handleTemplateUpload(e) {
    let r = new FileReader();
    r.onload = x => { 
        let arrayBuffer = x.target.result;
        let wb = XLSX.read(new Uint8Array(arrayBuffer), {type: 'array', cellStyles: true});
        
        let templateData = {
            SheetNames: wb.SheetNames,
            Sheets: {}
        };
        
        wb.SheetNames.forEach(sheetName => {
            templateData.Sheets[sheetName] = wb.Sheets[sheetName];
        });
        
        localStorage.miv_template = JSON.stringify(templateData);
        mivTemplate = templateData;
        updateUploadStatus();
        alert('MIV Template Uploaded Successfully!');
    };
    r.readAsArrayBuffer(e.target.files[0]);
}

function filterTable(bodyId, col, val) {
    let rows = document.getElementById(bodyId).rows;
    for (let r of rows) r.style.display = r.cells[col].innerText.toLowerCase().includes(val.toLowerCase()) ? "" : "none";
}

function initModalDrag() {
    const modal = document.getElementById('confirmModal');
    const modalContent = document.querySelector('.modal-content');
    const modalHeader = document.querySelector('.modal-header');
    
    if (!modalHeader) return;
    
    modalHeader.addEventListener('mousedown', dragStart);
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', dragEnd);
    
    modalHeader.addEventListener('touchstart', dragStart);
    document.addEventListener('touchmove', drag);
    document.addEventListener('touchend', dragEnd);
}

function dragStart(e) {
    const modalContent = document.querySelector('.modal-content');
    if (e.type === "touchstart") {
        modalDrag.initialX = e.touches[0].clientX - modalDrag.xOffset;
        modalDrag.initialY = e.touches[0].clientY - modalDrag.yOffset;
    } else {
        modalDrag.initialX = e.clientX - modalDrag.xOffset;
        modalDrag.initialY = e.clientY - modalDrag.yOffset;
    }
    
    if (e.target.closest('.modal-header')) {
        modalDrag.active = true;
        modalContent.style.margin = '0';
        modalContent.style.position = 'absolute';
    }
}

function drag(e) {
    if (modalDrag.active) {
        e.preventDefault();
        const modalContent = document.querySelector('.modal-content');
        
        if (e.type === "touchmove") {
            modalDrag.currentX = e.touches[0].clientX - modalDrag.initialX;
            modalDrag.currentY = e.touches[0].clientY - modalDrag.initialY;
        } else {
            modalDrag.currentX = e.clientX - modalDrag.initialX;
            modalDrag.currentY = e.clientY - modalDrag.initialY;
        }
        
        modalDrag.xOffset = modalDrag.currentX;
        modalDrag.yOffset = modalDrag.currentY;
        
        modalContent.style.transform = `translate(${modalDrag.currentX}px, ${modalDrag.currentY}px)`;
    }
}

function dragEnd(e) {
    modalDrag.active = false;
}

function closeModal() {
    document.getElementById('confirmModal').style.display = 'none';
    const modalContent = document.querySelector('.modal-content');
    modalContent.style.transform = 'translate(0, 0)';
    modalDrag.xOffset = 0;
    modalDrag.yOffset = 0;
}

function logout() { location.reload(); }
</script>

</div>

</div>
